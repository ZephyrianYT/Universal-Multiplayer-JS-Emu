# Unraid (Compose Manager plugin): change the build path and the two host folders, then Compose Up.
services:
  retro-hub:
    build: .                      # Unraid: /mnt/user/appdata/retro-hub/src
    image: retro-hub:1.2.0
    # No build needed: delete the two lines above and use the published image instead:
    # image: ghcr.io/<github-user>/<repo>:latest
    container_name: retro-hub
    ports:
      - "8080:8080"
    volumes:
      - ./roms:/roms:ro           # Unraid: /mnt/user/roms:/roms:ro   (your whole ROM share, read-only)
      - ./cache:/cache            # Unraid: /mnt/user/appdata/retro-hub/cache
    environment:
      - ADMIN_PASSWORD=change-me-owner   # "Unlock library" in the hub; players need no password
      # - ADMIN_KEYS=XXXXXXXXXXXXXXXX    # or your account ID(s): unlocks the library automatically
      # - ACCESS_PASSWORD=               # optional server-wide access code (empty = anyone with the link)
      - MAX_PLAYERS=4
      # - TRUST_PROXY=1           # set when behind Nginx Proxy Manager / SWAG / Cloudflare tunnel
      # - TURN_URL=turn:turn.example.com:3478
      # - TURN_USERNAME=user
      # - TURN_CREDENTIAL=secret
    restart: unless-stopped
